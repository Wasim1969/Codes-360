<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codes 360</title><link rel="stylesheet" href="style.css"><script defer src="database.js"></script><script defer src="app.js"></script></head><body><header><div><h1>Codes 360</h1><small>PREAUTHORIZATION CODE MANAGEMENT · V1.0</small></div><button id="add">+ Add Code</button><button id="backup">Export Backup</button><button id="restore">Import Backup</button><input type="file" id="file" accept=".json" hidden></header><main><nav id="tabs"></nav><p class="notice">Source: classified workbook. Screenshot reconciliation pending. Truncated descriptions require verification before clinical use.</p><div class="filters"><input id="search" type="search" placeholder="Search ID, diagnosis, specialty or keyword…" aria-label="Search codes"><select id="specialty" aria-label="Specialty"></select></div><div class="toolbar"><label><input type="checkbox" id="all"> Select all results</label><span id="count"></span><span id="status" role="status"></span></div><div id="results"></div></main><aside><div><strong id="selected">0 selected</strong><label><input type="checkbox" id="ids"> Include Code IDs</label></div><textarea id="preview" readonly aria-label="Selected descriptions" placeholder="Selected descriptions appear here"></textarea><button id="copy">Copy Selected</button><button id="clear">Clear</button></aside><dialog id="editor"><form id="form"><h2 id="editorTitle">Add New Code</h2><label>Main category<select id="category"></select></label><label>Original Code ID<input id="codeId" required pattern="[0-9]+" inputmode="numeric"></label><label>Code description<textarea id="description" required rows="5"></textarea></label><label>Medical specialty<select id="assignment"></select></label><p id="suggestion"></p><label>DRG label<select id="drg"><option value="">None</option><option>DRG Related</option><option>Non DRG Related</option></select></label><div class="actions"><button type="submit">Save Code</button><button type="button" id="cancel">Cancel</button></div></form></dialog></body></html>
